global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: crypto-exporter
    static_configs:
      - targets: ["exporter:8000"]

  - job_name: crypto-forecaster
    static_configs:
      - targets: ["forecaster:8001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
